<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MathGraph · 数学认知地图 & 复习决策系统</title>
  <script src="https://cdn.jsdelivr.net/npm/dexie@4.0.4/dist/dexie.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.6/dist/vis-network.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vis-network@9.1.6/dist/vis-network.min.css" />
  <style>
/* pdf.js lazy: loaded on demand */

/* ============================================================
   CSS VARIABLES — 暗黑/浅色双主题
   ============================================================ */
:root {
  --bg: #0f1117;
  --panel-bg: #181b22;
  --panel-bg2: #1d2028;
  --panel-bg3: #22262f;
  --border: #2a2e38;
  --border-active: #4a5568;
  --text: #e2e6ec;
  --text-muted: #8899aa;
  --text-dim: #5a6775;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --radius: 10px;
  --radius-sm: 6px;
  --font: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Consolas", monospace;
  --transition: 0.2s ease;

  /* 科目色 */
  --sub-gaoshu: #4da6ff;
  --sub-gaoshu-bg: rgba(77,166,255,0.12);
  --sub-gaoshu-border: rgba(77,166,255,0.35);
  --sub-xiandai: #4de39a;
  --sub-xiandai-bg: rgba(77,227,154,0.12);
  --sub-xiandai-border: rgba(77,227,154,0.35);
  --sub-gailv: #b98aff;
  --sub-gailv-bg: rgba(185,138,255,0.12);
  --sub-gailv-border: rgba(185,138,255,0.35);
  --sub-lisan: #ffac4b;
  --sub-lisan-bg: rgba(255,172,75,0.12);
  --sub-lisan-border: rgba(255,172,75,0.35);

  /* 状态色 */
  --mastery-none: #5a6775;
  --mastery-weak: #ff6677;
  --mastery-learning: #ffac4b;
  --mastery-good: #4da6ff;
  --mastery-mastered: #4de39a;

  /* 紧急度 */
  --urgent-red: #ff6677;
  --urgent-yellow: #ffac4b;
  --urgent-green: #4de39a;

  --danger: #ff6677;
  --accent: #28d7e7;
}

[data-theme="light"] {
  --bg: #f5f6f8;
  --panel-bg: #ffffff;
  --panel-bg2: #f8f9fb;
  --panel-bg3: #eef0f4;
  --border: #e2e5ea;
  --border-active: #b0b8c4;
  --text: #1a1d24;
  --text-muted: #667180;
  --text-dim: #a0a8b4;
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
}

/* ============================================================
   RESET & BASE
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  overflow: hidden;
}
button { font-family: var(--font); cursor: pointer; border: none; outline: none; }
input, textarea, select { font-family: var(--font); outline: none; }
a { color: var(--accent); text-decoration: none; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ============================================================
   APP SHELL
   ============================================================ */
.app {
  display: grid;
  grid-template-columns: 280px 1fr 340px;
  grid-template-rows: 1fr auto;
  height: 100vh;
  min-width: 1280px;
}

/* ============================================================
   LEFT PANEL
   ============================================================ */
.left-panel {
  background: var(--panel-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 10;
}
.left-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.left-header .logo {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.5px;
}
.left-header .logo span { color: var(--accent); }
.left-header .theme-btn {
  width: 32px; height: 32px;
  border-radius: var(--radius-sm);
  background: var(--panel-bg3);
  color: var(--text-muted);
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}
.left-header .theme-btn:hover { color: var(--text); }

.left-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 12px 14px;
  display: flex; flex-direction: column; gap: 12px;
}

/* 区块 */
.section { }
.section-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 8px;
  padding-left: 2px;
}

/* 模式切换 */
.mode-tabs {
  display: flex; flex-wrap: wrap; gap: 4px;
}
.mode-tab {
  padding: 5px 10px;
  font-size: 12px;
  border-radius: var(--radius-sm);
  background: var(--panel-bg3);
  color: var(--text-muted);
  transition: var(--transition);
  white-space: nowrap;
}
.mode-tab:hover { color: var(--text); }
.mode-tab.active {
  background: var(--accent);
  color: #000;
  font-weight: 600;
}

/* 搜索 */
.search-wrap { position: relative; }
.search-wrap input {
  width: 100%;
  padding: 8px 28px 8px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--panel-bg3);
  color: var(--text);
  font-size: 13px;
  transition: var(--transition);
}
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap .search-icon {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  color: var(--text-dim); font-size: 14px; pointer-events: none;
}

/* 课程树 */
.course-tree { }
.course-node { }
.course-node-header {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 6px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13px;
  transition: var(--transition);
  user-select: none;
}
.course-node-header:hover { background: var(--panel-bg3); }
.course-node-header .arrow {
  width: 16px; text-align: center;
  font-size: 10px; color: var(--text-dim);
  transition: transform 0.15s;
}
.course-node-header .arrow.open { transform: rotate(90deg); }
.course-node-header .dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.course-node-children {
  padding-left: 18px;
  display: none;
}
.course-node-children.open { display: block; }
.course-node-child {
  padding: 4px 8px; font-size: 12px;
  border-radius: var(--radius-sm);
  cursor: pointer; color: var(--text-muted);
  transition: var(--transition);
}
.course-node-child:hover { background: var(--panel-bg3); color: var(--text); }
.course-node-child.active { color: var(--accent); font-weight: 600; }

/* 今日复习 */
.review-list { max-height: 180px; overflow-y: auto; }
.review-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: var(--radius-sm);
  cursor: pointer; font-size: 12px;
  transition: var(--transition);
  border-left: 3px solid transparent;
}
.review-item:hover { background: var(--panel-bg3); }
.review-item.urgent-red { border-left-color: var(--urgent-red); }
.review-item.urgent-yellow { border-left-color: var(--urgent-yellow); }
.review-item.urgent-green { border-left-color: var(--urgent-green); }
.review-item .badge {
  font-size: 10px; padding: 1px 6px; border-radius: 10px;
  font-weight: 600;
}
.review-item .badge.red { background: rgba(255,102,119,0.2); color: var(--urgent-red); }
.review-item .badge.yellow { background: rgba(255,172,75,0.2); color: var(--urgent-yellow); }
.review-item .badge.green { background: rgba(77,227,154,0.2); color: var(--urgent-green); }

/* 统计 */
.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.stat-card {
  background: var(--panel-bg3);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  text-align: center;
}
.stat-card .num { font-size: 20px; font-weight: 700; }
.stat-card .label { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

/* ============================================================
   CENTER CANVAS
   ============================================================ */
.center-canvas {
  position: relative;
  background: var(--bg);
  overflow: hidden;
}
.canvas-toolbar {
  position: absolute;
  top: 12px; right: 14px;
  display: flex; gap: 6px; z-index: 20;
}
.canvas-toolbar button {
  padding: 6px 12px; font-size: 12px;
  border-radius: var(--radius-sm);
  background: var(--panel-bg2);
  color: var(--text-muted);
  border: 1px solid var(--border);
  transition: var(--transition);
}
.canvas-toolbar button:hover {
  color: var(--text);
  border-color: var(--border-active);
}
.canvas-hint {
  position: absolute;
  bottom: 16px; left: 50%; transform: translateX(-50%);
  font-size: 11px; color: var(--text-dim);
  background: var(--panel-bg2);
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  pointer-events: none;
  z-index: 10;
}
#mynetwork {
  width: 100%;
  height: 100%;
}

/* ============================================================
   RIGHT PANEL
   ============================================================ */
.right-panel {
  background: var(--panel-bg);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 10;
}
.right-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 14px; font-weight: 700;
  display: flex; align-items: center; justify-content: space-between;
}
.right-header .close-btn {
  width: 28px; height: 28px;
  border-radius: var(--radius-sm);
  background: var(--panel-bg3);
  color: var(--text-muted);
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
}
.right-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: flex; flex-direction: column; gap: 12px;
}

/* 卡片 */
.card { }
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0;
  cursor: pointer;
  user-select: none;
}
.card-header .card-title {
  font-size: 13px; font-weight: 700;
}
.card-header .card-arrow {
  font-size: 10px; color: var(--text-dim);
  transition: transform 0.15s;
}
.card-header .card-arrow.open { transform: rotate(90deg); }
.card-body {
  display: none;
  font-size: 13px; line-height: 1.7;
  color: var(--text-muted);
  padding: 4px 0 8px;
}
.card-body.open { display: block; }

/* 标签 */
.tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  font-size: 11px; padding: 3px 8px; border-radius: 12px;
  font-weight: 600;
}
.tag.gaoshu { background: var(--sub-gaoshu-bg); color: var(--sub-gaoshu); }
.tag.xiandai { background: var(--sub-xiandai-bg); color: var(--sub-xiandai); }
.tag.gailv { background: var(--sub-gailv-bg); color: var(--sub-gailv); }
.tag.lisan { background: var(--sub-lisan-bg); color: var(--sub-lisan); }
.tag.mastery-none { background: rgba(90,103,117,0.2); color: var(--mastery-none); }
.tag.mastery-weak { background: rgba(255,102,119,0.2); color: var(--mastery-weak); }
.tag.mastery-learning { background: rgba(255,172,75,0.2); color: var(--mastery-learning); }
.tag.mastery-good { background: rgba(77,166,255,0.2); color: var(--mastery-good); }
.tag.mastery-mastered { background: rgba(77,227,154,0.2); color: var(--mastery-mastered); }
.tag.freq-high { background: rgba(255,102,119,0.15); color: var(--urgent-red); }
.tag.freq-mid { background: rgba(255,172,75,0.15); color: var(--urgent-yellow); }
.tag.freq-low { background: rgba(90,103,117,0.15); color: var(--text-dim); }

/* 草稿板 */
.draft-pad {
  border-top: 1px solid var(--border);
  padding: 12px;
}
.draft-pad textarea {
  width: 100%;
  height: 120px;
  resize: vertical;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--panel-bg3);
  color: var(--text);
  font-size: 13px;
  font-family: var(--font-mono);
  line-height: 1.6;
}

/* ============================================================
   MODAL
   ============================================================ */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
}
.modal {
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  width: 520px;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  font-size: 15px; font-weight: 700;
  display: flex; align-items: center; justify-content: space-between;
}
.modal-body {
  flex: 1; overflow-y: auto; padding: 16px 18px;
  display: flex; flex-direction: column; gap: 12px;
}
.modal-footer {
  padding: 12px 18px;
  border-top: 1px solid var(--border);
  display: flex; gap: 8px; justify-content: flex-end;
}
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group label {
  font-size: 12px; font-weight: 600; color: var(--text-muted);
}
.form-group input, .form-group textarea, .form-group select {
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--panel-bg3);
  color: var(--text);
  font-size: 13px;
}
.form-group textarea { min-height: 60px; resize: vertical; font-family: var(--font-mono); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

.btn {
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  transition: var(--transition);
}
.btn-primary {
  background: var(--accent);
  color: #000;
}
.btn-primary:hover { filter: brightness(1.1); }
.btn-secondary {
  background: var(--panel-bg3);
  color: var(--text-muted);
}
.btn-secondary:hover { color: var(--text); }
.btn-danger {
  background: rgba(255,102,119,0.15);
  color: var(--danger);
}
.btn-danger:hover { background: rgba(255,102,119,0.25); }
.btn-sm { padding: 4px 10px; font-size: 11px; }

/* error type pie */
.pie-wrap {
  display: flex; align-items: center; gap: 12px;
}
.pie-svg { flex-shrink: 0; }
.pie-legend { display: flex; flex-direction: column; gap: 4px; font-size: 11px; }
.pie-legend-item { display: flex; align-items: center; gap: 6px; }
.pie-legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

/* toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 20px;
  border-radius: 20px;
  background: var(--panel-bg2);
  color: var(--text);
  border: 1px solid var(--border);
  font-size: 13px;
  z-index: 200;
  animation: toastIn 0.3s ease, toastOut 0.3s ease 1.7s forwards;
}
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(12px); } }
@keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(12px); } }

.hidden { display: none !important; }
</style>
</head>
<body>

<div class="app">

  <!-- ==============================
       LEFT PANEL
       ============================== -->
  <aside class="left-panel">
    <div class="left-header">
      <div class="logo">Math<span>Graph</span></div>
      <button class="theme-btn" id="themeBtn" title="切换主题">🌓</button>
    </div>
    <div class="left-scroll">

      <!-- 考试模式 -->
      <div class="section">
        <div class="section-title">🎯 考试模式</div>
        <select id="examModeSelect" style="width:100%;padding:6px 8px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--panel-bg3);color:var(--text);font-size:12px;">
          <option value="default">综合学习</option>
          <option value="final">期末考试</option>
          <option value="kaoyan1">考研数学一</option>
          <option value="kaoyan2">考研数学二</option>
          <option value="kaoyan3">考研数学三</option>
          <option value="makeup">补考冲刺</option>
        </select>
      </div>
      <!-- 模式切换 -->
      <div class="section">
        <div class="section-title">图谱视图</div>
        <div class="mode-tabs" id="modeTabs">
          <button class="mode-tab active" data-mode="structure">知识结构</button>
          <button class="mode-tab" data-mode="exam">考试重点</button>
          <button class="mode-tab" data-mode="weak">我的薄弱点</button>
          <button class="mode-tab" data-mode="mistakes">错题地图</button>
        </div>
      </div>

      <!-- 搜索 -->
      <div class="section">
        <div class="search-wrap">
          <input type="text" id="searchInput" placeholder="搜索知识点、公式、错题…" />
          <span class="search-icon">🔍</span>
        </div>
      </div>

      <!-- 课程树 -->
      <div class="section">
        <div class="section-title">课程目录</div>
        <div class="course-tree" id="courseTree"></div>
      </div>

      <!-- 今日复习 -->
      <div class="section">
        <div class="section-title">📅 今日复习</div>
        <div class="review-list" id="reviewList">
          <div style="font-size:12px;color:var(--text-dim);padding:4px 0;">暂无待复习项</div>
        </div>
      </div>

      <!-- 统计 -->
      <div class="section">
        <div class="section-title">📊 掌握度统计</div>
        <div class="stat-grid" id="statGrid">
          <div class="stat-card"><div class="num" style="color:var(--mastery-mastered)">0</div><div class="label">熟练掌握</div></div>
          <div class="stat-card"><div class="num" style="color:var(--mastery-good)">0</div><div class="label">初步掌握</div></div>
          <div class="stat-card"><div class="num" style="color:var(--mastery-learning)">0</div><div class="label">学习中</div></div>
          <div class="stat-card"><div class="num" style="color:var(--mastery-weak)">0</div><div class="label">薄弱考点</div></div>
        </div>
      </div>

      <!-- 操作按钮 -->
      <div class="section" style="display:flex;flex-direction:column;gap:6px;">
        <button class="btn btn-primary" id="btnAddNode">＋ 新增节点</button>
        <button class="btn btn-secondary" id="btnImport">📥 导入 JSON</button>
        <button class="btn btn-secondary" id="btnExport">📤 导出 JSON</button>
        <button class="btn btn-secondary" id="btnSeed">🚀 一键导入种子数据</button>
        <button class="btn btn-secondary" id="btnImportPDF">📄 PDF目录导入</button>
        <button class="btn btn-secondary" id="btnImportMD">📝 笔记导入(.md)</button>
        <button class="btn btn-primary" id="btnQuiz" style="margin-top:4px;">🎯 自测练习</button>
        <button class="btn btn-secondary" id="btnScreenshot">📸 截图导出</button>
      </div>

    </div>
  </aside>

  <!-- ==============================
       CENTER CANVAS
       ============================== -->
  <main class="center-canvas">
    <div class="canvas-toolbar">
      <button id="btnFit" title="重置布局">⊞ 适应窗口</button>
      <button id="btnHierarchy" title="层级布局">📐 层级排列</button>
    </div>
    <div id="mynetwork"></div>
    <div class="canvas-hint">🖱 拖拽节点 · 滚轮缩放 · 悬浮预览 · 点击高亮 · 双击打开卡片 · 右键菜单</div>
  </main>

  <!-- ==============================
       RIGHT PANEL
       ============================== -->
  <aside class="right-panel" id="rightPanel">
    <div class="right-header">
      <span id="rightTitle">选择一个知识点</span>
      <button class="close-btn" id="btnCloseRight">✕</button>
    </div>
    <div class="right-scroll" id="rightContent">
      <div style="color:var(--text-dim);font-size:13px;text-align:center;padding:60px 0;">
        点击图谱中的节点<br>查看知识卡片
      </div>
    </div>
    <div class="draft-pad">
      <textarea id="draftPad" placeholder="📝 草稿板 — 演算公式、推导步骤…"></textarea>
    </div>
  </aside>

</div>

<!-- ==============================
     MODAL CONTAINER
     ============================== -->
<div id="modalContainer"></div>

<!-- ==============================
     TOAST
     ============================== -->
<div id="toastContainer" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;"></div>

<script>
// ============================================================
//  CONFIG & CONSTANTS
// ============================================================
const SUBJECTS = {
  gaoshu: { label: '高等数学', color: '#4da6ff', cssClass: 'gaoshu' },

// pdf.js 懒加载
let pdfjsLib = null;
async function ensurePDFJS() {
  if (pdfjsLib) return pdfjsLib;
  const script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
  await new Promise((resolve, reject) => { script.onload = resolve; script.onerror = reject; });
  document.head.appendChild(script);
  pdfjsLib = window['pdfjs-dist/build/pdf'] || window.pdfjsLib;
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  return pdfjsLib;
}

function calcExamIndex(node, mode = 'default') {
  const m = EXAM_MODES[mode] || EXAM_MODES.default;
  const freq = node.frequency || node.examFrequency === 'high' ? 5 : node.examFrequency === 'mid' ? 3 : 1;
  const score = node.examScore || node.examValue || 3;
  const imp = node.importance || 3;
  const diff = node.difficulty || 3;
  return Math.round(freq * m.frequencyW * 20 + score * m.examScoreW * 20 + imp * m.importanceW * 20 + diff * m.difficultyW * 20);
}

function uid() { return 'n_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7); }
function today() { return new Date().toISOString().slice(0, 10); }
function daysFromNow(days) {
  const d = new Date(); d.setDate(d.getDate() + days); return d.toISOString().slice(0, 10);
}
function daysDiff(a, b) {
  return Math.floor((new Date(b) - new Date(a)) / 86400000);
}

function getSubjectColor(subject) {
  const s = SUBJECTS[subject];
  return s ? s.color : '#888';
}

function getMasteryColor(mastery) {
  const m = MASTERY_LABELS[mastery] || MASTERY_LABELS.none;
  return m.color;
}

function getNodeSize(node) {
  const freq = node.examFrequency || 'low';
  const base = node.type === 'mistake' ? 14 : node.type === 'exam_point' ? 20 : 20;
  if (freq === 'high') return base + 10;
  if (freq === 'mid') return base + 5;
  return base;
}

function getNodeOpacity(mastery) {
  if (mastery === 'mastered') return 1;
  if (mastery === 'good') return 0.85;
  if (mastery === 'learning') return 0.65;
  if (mastery === 'weak') return 0.45;
  return 0.55;
}

function getNodeBorderColor(node) {
  if (node.mastery === 'weak') return MASTERY_LABELS.weak.color;
  return getSubjectColor(node.subject);
}

function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

// ============================================================
//  LOAD FROM DB
// ============================================================
async function loadData() {
  const nodes = await db.nodes.toArray();
  const edges = await db.edges.toArray();
  const formulas = await db.formulas.toArray();
  const mistakes = await db.mistakes.toArray();
  const studyRecords = await db.studyRecords.toArray();
  const paths = await db.learningPaths.toArray();
  const questions = await db.questions.toArray();

  state.nodes = new Map(nodes.map(n => [n.id, n]));
  state.edges = new Map(edges.map(e => [e.id, e]));
  state.formulas = new Map(formulas.map(f => [f.id, f]));
  state.mistakes = new Map();
  for (const m of mistakes) {
    if (!state.mistakes.has(m.nodeId)) state.mistakes.set(m.nodeId, []);
    state.mistakes.get(m.nodeId).push(m);
  }
  state.questions = new Map(questions.map(q => [q.id, q]));
  state.studyRecords = studyRecords;
  state.learningPaths = paths;

  // load settings
  const themeRow = await db.settings.get('theme');
  if (themeRow) { state.theme = themeRow.value; applyTheme(); }
  const examModeRow = await db.settings.get('examMode');
  if (examModeRow) {
    state.examMode = examModeRow.value;
    document.getElementById('examModeSelect').value = examModeRow.value;
  }

  // check review deadlines
  await checkReviewDue();
}

// ============================================================
//  VIS-NETWORK SETUP
// ============================================================
function buildNetworkData() {
  const nodes = [];
  const edges = [];

  for (const node of state.nodes.values()) {
    const borderColor = getNodeBorderColor(node);
    const subjectColor = getSubjectColor(node.subject);
    const opacity = getNodeOpacity(node.mastery);
    const size = getNodeSize(node);
    const typeIcon = NODE_TYPES[node.type]?.icon || '📘';

    // 错题角标
    const mistakeCount = (state.mistakes.get(node.id) || []).length;
    const mistakeBadge = mistakeCount > 0 ? ` 🔴${mistakeCount}` : '';

    // 重要性星标
    const stars = node.importance ? '⭐'.repeat(node.importance) : '';

    nodes.push({
      id: node.id,
      label: `${typeIcon} ${node.name}${mistakeBadge}\n${stars}`,
      title: buildTooltip(node),
      color: {
        background: hexToRgba(subjectColor, opacity * 0.15),
        border: borderColor,
        highlight: { background: hexToRgba(subjectColor, 0.3), border: subjectColor },
      },
      borderWidth: node.mastery === 'weak' ? 3 : 1.5,
      size: size,
      font: {
        color: document.documentElement.getAttribute('data-theme') === 'light' ? '#1a1d24' : '#e2e6ec',
        size: 12,
        face: 'PingFang SC, Microsoft YaHei, sans-serif',
        multi: true,
      },
      shape: node.type === 'mistake' ? 'square' : node.type === 'exam_point' ? 'diamond' : 'dot',
    });
  }

  for (const edge of state.edges.values()) {
    const et = EDGE_TYPES[edge.type] || { label: edge.type, icon: '' };
    edges.push({
      id: edge.id,
      from: edge.from,
      to: edge.to,
      label: edge.description || et.label,
      title: `<b>${et.label}</b>${edge.description ? '<br>' + escapeHtml(edge.description) : ''}`,
      arrows: edge.type === 'prerequisite' ? 'to' : edge.type === 'derive' ? 'to' : edge.type === 'apply' ? 'to' : 'to',
      color: { color: edge.type === 'confuse' ? '#ff6677' : edge.type === 'prerequisite' ? '#8899aa' : '#4da6ff', opacity: 0.6 },
      dashes: edge.type === 'confuse' ? true : edge.type === 'compare' ? [5, 5] : false,
      width: edge.type === 'exam' ? 2 : 1,
    });
  }

  return { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function buildTooltip(node) {
  const typeLabel = NODE_TYPES[node.type]?.label || node.type;
  const subjectLabel = SUBJECTS[node.subject]?.label || node.subject;
  const masteryLabel = MASTERY_LABELS[node.mastery]?.label || '未复习';
  let html = `<b>${escapeHtml(node.name)}</b><br>`;
  html += `类型: ${typeLabel} | 科目: ${subjectLabel}<br>`;
  html += `章节: ${escapeHtml(node.chapter || '—')}<br>`;
  if (node.definition) html += `定义: ${escapeHtml(node.definition.slice(0, 80))}…<br>`;
  html += `掌握度: ${masteryLabel}<br>`;
  if (node.examFrequency) html += `考频: ${node.examFrequency}<br>`;
  if (node.importance) html += `重要性: ${'⭐'.repeat(node.importance)}<br>`;
  return html;
}

function initNetwork() {
  const container = document.getElementById('mynetwork');
  const data = buildNetworkData();
  const options = {
    physics: {
      enabled: true,
      solver: 'forceAtlas2Based',
      forceAtlas2Based: {
        gravitationalConstant: -50,
        centralGravity: 0.01,
        springLength: 200,
        springConstant: 0.08,
      },
      stabilization: { iterations: 100, fit: true },
    },
    interaction: {
      hover: true,
      tooltipDelay: 200,
      zoomView: true,
      dragView: true,
      navigationButtons: false,
      keyboard: { enabled: true, bindToWindow: false },
    },
    edges: {
      smooth: { type: 'continuous', roundness: 0.3 },
      font: { size: 10, color: '#8899aa', face: 'PingFang SC, Microsoft YaHei, sans-serif' },
    },
    layout: { hierarchical: false },
  };

  state.network = new vis.Network(container, data, options);

  // Events
  state.network.on('click', handleNetworkClick);
  state.network.on('doubleClick', handleNetworkDblClick);
  state.network.on('oncontext', handleNetworkRightClick);
  state.network.on('selectNode', handleNodeSelect);
  state.network.on('deselectNode', handleNodeDeselect);

  // Save positions after dragging
  state.network.on('dragEnd', async (params) => {
    for (const nid of params.nodes) {
      const pos = state.network.getPositions([nid]);
      const node = state.nodes.get(nid);
      if (node && pos[nid]) {
        node._x = pos[nid].x;
        node._y = pos[nid].y;
        await db.nodes.put(node);
      }
    }
  });
}

function refreshNetwork() {
  if (!state.network) return;
  const data = buildNetworkData();
  state.network.setData(data);
  applyMode();
}

async function handleNetworkClick(params) {
  if (params.nodes.length === 0) {
    // 点击空白
    state.selectedNodeId = null;
    updateRightPanel(null);
  }
}

async function handleNetworkDblClick(params) {
  if (params.nodes.length > 0) {
    const nodeId = params.nodes[0];
    state.selectedNodeId = nodeId;
    updateRightPanel(nodeId);
    state.network.focus(nodeId, { scale: 1.3, animation: { duration: 300, easingFunction: 'easeInOutQuad' } });
  }
}

function handleNetworkRightClick(params) {
  params.event.preventDefault();
  if (params.nodes.length > 0) {
    showNodeContextMenu(params.nodes[0], params.event);
  }
}

async function handleNodeSelect(params) {
  if (params.nodes.length > 0) {
    const nodeId = params.nodes[0];
    // highlight connected
    const connected = state.network.getConnectedNodes(nodeId);
    const allNodes = [...connected, nodeId];
    // we don't use highlight method to avoid hide, instead we visually indicate
    state.selectedNodeId = nodeId;
    updateRightPanel(nodeId);
  }
}

function handleNodeDeselect() {
  // keep right panel content
}

// ============================================================
//  MODE FILTERS
// ============================================================
function applyMode() {
  if (!state.network) return;
  const mode = state.currentMode;
  const allIds = [...state.nodes.keys()];

  if (mode === 'structure') {
    state.network.unselectAll();
  } else if (mode === 'exam') {
    // 只显示考试价值高的节点
    const visible = allIds.filter(id => {
      const n = state.nodes.get(id);
      return n && parseInt(n.examValue) >= 3;
    });
    if (visible.length === 0) toast('暂无高考试价值节点，请先标记 examValue');
    // For now just select them
    state.network.selectNodes(visible);
  } else if (mode === 'weak') {
    const visible = allIds.filter(id => {
      const n = state.nodes.get(id);
      return n && (n.mastery === 'weak' || n.mastery === 'none' || (n.mastery && MASTERY_LABELS[n.mastery]?.color === '#ff6677'));
    });
    state.network.selectNodes(visible);
  } else if (mode === 'mistakes') {
    const visible = [];
    for (const [nid, ms] of state.mistakes) {
      if (ms.length > 0) visible.push(nid);
    }
    state.network.selectNodes(visible);
  }
}

// ============================================================
//  RIGHT PANEL
// ============================================================
function updateRightPanel(nodeId) {
  const container = document.getElementById('rightContent');
  const title = document.getElementById('rightTitle');
  if (!nodeId || !state.nodes.has(nodeId)) {
    title.textContent = '选择一个知识点';
    container.innerHTML = '<div style="color:var(--text-dim);font-size:13px;text-align:center;padding:60px 0;">点击图谱中的节点<br>查看知识卡片</div>';
    return;
  }

  const node = state.nodes.get(nodeId);
  const formulas = [...state.formulas.values()].filter(f => f.nodeId === nodeId);
  const mistakes = state.mistakes.get(nodeId) || [];
  const subjectLabel = SUBJECTS[node.subject]?.label || node.subject;
  const typeLabel = NODE_TYPES[node.type]?.label || node.type;
  const masteryLabel = MASTERY_LABELS[node.mastery]?.label || '未复习';
  const masteryCss = MASTERY_LABELS[node.mastery]?.cssClass || 'mastery-none';
  const freqCss = FREQ_LABELS[node.examFrequency]?.cssClass || '';

  title.textContent = node.name;

  let html = '';
  // 标签行
  html += '<div class="tag-row">';
  html += `<span class="tag ${SUBJECTS[node.subject]?.cssClass || ''}">${subjectLabel}</span>`;
  html += `<span class="tag">${typeLabel}</span>`;
  html += `<span class="tag ${masteryCss}">${masteryLabel}</span>`;
  if (node.examFrequency) html += `<span class="tag ${freqCss}">${FREQ_LABELS[node.examFrequency]?.label || node.examFrequency}</span>`;
  if (node.importance) html += `<span class="tag">重要 ${'⭐'.repeat(node.importance)}</span>`;
  html += '</div>';

  // 章节
  if (node.chapter) html += `<div style="font-size:12px;color:var(--text-dim);margin-top:4px;">📂 ${escapeHtml(node.chapter)}</div>`;
  if (node.module) html += `<div style="font-size:12px;color:var(--text-dim);">📦 ${escapeHtml(node.module)}</div>`;

  // 核心定义
  if (node.definition) {
    html += collapsible('核心定义', escapeHtml(node.definition), true);
  }

  // 公式
  if (formulas.length > 0) {
    let fb = '';
    for (const f of formulas) {
      fb += `<div style="margin-bottom:8px;padding:8px;background:var(--panel-bg3);border-radius:var(--radius-sm);">`;
      fb += `<div style="font-weight:600;font-size:12px;margin-bottom:4px;">${escapeHtml(f.name || '公式')}</div>`;
      if (f.latex) {
        try {
          fb += `<div style="overflow-x:auto;">${katex.renderToString(f.latex, { throwOnError: false, displayMode: true })}</div>`;
        } catch(e) { fb += `<code>${escapeHtml(f.latex)}</code>`; }
      }
      if (f.conditions) fb += `<div style="font-size:11px;color:var(--text-muted);margin-top:4px;">条件: ${escapeHtml(f.conditions)}</div>`;
      if (f.example) {
        fb += `<div style="font-size:11px;color:var(--text-muted);margin-top:2px;">例题: ${escapeHtml(f.example)}</div>`;
      }
      fb += '</div>';
    }
    html += collapsible('📐 关联公式', fb, true);
  }

  // 推导过程
  if (node.derivation) {
    html += collapsible('推导过程', escapeHtml(node.derivation));
  }

  // 常用结论
  if (node.conclusion) {
    html += collapsible('常用结论', escapeHtml(node.conclusion));
  }

  // 易错提醒 / 考场注意
  if (node.memoryTips) {
    html += collapsible('⚠️ 易错提醒', escapeHtml(node.memoryTips));
  }
  if (node.examNotes) {
    html += collapsible('🎯 考场注意事项', escapeHtml(node.examNotes));
  }

  // 先修知识
  if (node.prerequisite && node.prerequisite.length > 0) {
    const preqNames = node.prerequisite.map(pid => {
      const pn = state.nodes.get(pid);
      return pn ? pn.name : pid;
    }).join('、');
    html += `<div style="font-size:12px;color:var(--text-muted);margin:4px 0;">📖 先修知识: ${escapeHtml(preqNames)}</div>`;
  }

  // 题型
  if (node.questionTypes && node.questionTypes.length > 0) {
    let qhtml = '<div class="tag-row">';
    for (const qt of node.questionTypes) {
      qhtml += `<span class="tag" style="background:var(--panel-bg3);">${escapeHtml(qt)}</span>`;
    }
    qhtml += '</div>';
    html += collapsible('📝 常考题型', qhtml);
  }

  // 错题列表
  if (mistakes.length > 0) {
    let mhtml = '';
    for (const m of mistakes) {
      const mtLabel = MISTAKE_TYPES[m.mistakeType]?.label || m.mistakeType;
      mhtml += `<div style="margin-bottom:8px;padding:8px;background:var(--panel-bg3);border-radius:var(--radius-sm);border-left:3px solid ${MISTAKE_TYPES[m.mistakeType]?.color || '#888'};">`;
      mhtml += `<div style="font-size:12px;font-weight:600;">${escapeHtml(m.question?.slice(0, 60) || '错题')}</div>`;
      mhtml += `<div style="font-size:11px;color:var(--text-muted);margin-top:2px;">类型: ${mtLabel} | ${escapeHtml(m.createdAt?.slice(0,10) || '')}</div>`;
      mhtml += `<div style="font-size:11px;color:var(--text-dim);margin-top:2px;">原因: ${escapeHtml(m.reason?.slice(0, 60) || '')}</div>`;
      mhtml += '</div>';
    }
    html += collapsible(`❌ 错题 (${mistakes.length})`, mhtml, true);
  }

  // 编辑按钮
  html += `<div style="display:flex;gap:6px;margin-top:8px;">`;
  html += `<button class="btn btn-secondary btn-sm" onclick="openEditNodeModal('${nodeId}')">✏️ 编辑</button>`;
  html += `<button class="btn btn-secondary btn-sm" onclick="openMistakeModal('${nodeId}')">＋ 添加错题</button>`;
  html += `<button class="btn btn-secondary btn-sm" onclick="quickMastery('${nodeId}')">🔄 切换掌握度</button>`;
  html += `<button class="btn btn-danger btn-sm" onclick="deleteNodeConfirm('${nodeId}')">🗑 删除</button>`;
  html += '</div>';

  container.innerHTML = html;
}

function collapsible(title, body, open = false) {
  const arrowClass = open ? 'open' : '';
  const bodyClass = open ? 'open' : '';
  return `<div class="card">
    <div class="card-header" onclick="this.querySelector('.card-arrow').classList.toggle('open');this.nextElementSibling.classList.toggle('open');">
      <span class="card-title">${title}</span>
      <span class="card-arrow ${arrowClass}">▶</span>
    </div>
    <div class="card-body ${bodyClass}">${body}</div>
  </div>`;
}

function showNodeContextMenu(nodeId, event) {
  const existing = document.querySelector('.ctx-menu');
  if (existing) existing.remove();

  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.style.cssText = `
    position:fixed;left:${event.clientX}px;top:${event.clientY}px;z-index:150;
    background:var(--panel-bg);border:1px solid var(--border);
    border-radius:var(--radius-sm);box-shadow:var(--shadow);
    min-width:160px;font-size:13px;
  `;

  const items = [
    { label: '✏️ 编辑节点', action: () => openEditNodeModal(nodeId) },
    { label: '＋ 添加错题', action: () => openMistakeModal(nodeId) },
    { label: '⭐ 收藏/取消收藏', action: () => toggleFavorite(nodeId) },
    { label: '🔄 切换掌握度', action: () => quickMastery(nodeId) },
    { label: '🔗 创建连线', action: () => openEdgeModal(nodeId) },
    { label: '🗑 删除节点', action: () => deleteNodeConfirm(nodeId) },
  ];

  for (const item of items) {
    const div = document.createElement('div');
    div.textContent = item.label;
    div.style.cssText = 'padding:8px 12px;cursor:pointer;transition:0.1s;';
    div.onmouseenter = () => div.style.background = 'var(--panel-bg3)';
    div.onmouseleave = () => div.style.background = '';
    div.onclick = () => { menu.remove(); item.action(); };
    menu.appendChild(div);
  }

  document.body.appendChild(menu);
  const closeMenu = (e) => {
    if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('click', closeMenu); }
  };
  setTimeout(() => document.addEventListener('click', closeMenu), 0);
}

async function toggleFavorite(nodeId) {
  const node = state.nodes.get(nodeId);
  if (!node) return;
  node.favorite = !node.favorite;
  state.nodes.set(nodeId, node);
  await db.nodes.put(node);
  refreshNetwork();
  toast(node.favorite ? '已收藏' : '已取消收藏');
}

async function quickMastery(nodeId) {
  const node = state.nodes.get(nodeId);
  if (!node) return;
  const keys = ['none', 'weak', 'learning', 'good', 'mastered'];
  const idx = keys.indexOf(node.mastery || 'none');
  node.mastery = keys[(idx + 1) % keys.length];
  // Record study
  const record = {
    id: uid(),
    nodeId,
    mastery: node.mastery,
    timestamp: new Date().toISOString(),
  };
  state.studyRecords.push(record);
  await db.studyRecords.put(record);

  // Calculate next review
  const reviewCount = (node.reviewCount || 0) + 1;
  node.reviewCount = reviewCount;
  node.lastReview = today();
  const intervalIdx = Math.min(reviewCount - 1, REVIEW_INTERVALS.length - 1);
  node.nextReview = daysFromNow(REVIEW_INTERVALS[Math.max(0, intervalIdx)]);

  state.nodes.set(nodeId, node);
  await db.nodes.put(node);
  refreshNetwork();
  updateRightPanel(nodeId);
  renderReviewList();
  renderStats();
  toast(`掌握度: ${MASTERY_LABELS[node.mastery].label}`);
}

async function deleteNodeConfirm(nodeId) {
  if (!confirm('确定删除该节点及其相关连线和错题？此操作不可恢复。')) return;
  await deleteNode(nodeId);
}

async function deleteNode(nodeId) {
  state.nodes.delete(nodeId);
  await db.nodes.delete(nodeId);
  // Delete related edges
  for (const [eid, edge] of state.edges) {
    if (edge.from === nodeId || edge.to === nodeId) {
      state.edges.delete(eid);
      await db.edges.delete(eid);
    }
  }
  // Delete related mistakes
  await db.mistakes.where('nodeId').equals(nodeId).delete();
  state.mistakes.delete(nodeId);
  // Delete related formulas
  await db.formulas.where('nodeId').equals(nodeId).delete();
  // Clean from state.formulas map
  for (const [fid, f] of state.formulas) {
    if (f.nodeId === nodeId) state.formulas.delete(fid);
  }
  state.selectedNodeId = null;
  updateRightPanel(null);
  refreshNetwork();
  renderCourseTree();
  renderStats();
  toast('节点已删除');
}

async function saveNewNode() {
  const name = document.getElementById('fName').value.trim();
  if (!name) { toast('请输入知识点名称'); return; }

  const node = {
    id: uid(),
    name,
    type: document.getElementById('fNodeType').value,
    subject: document.getElementById('fSubject').value,
    chapter: document.getElementById('fChapter').value.trim(),
    module: document.getElementById('fModule').value.trim(),
    definition: document.getElementById('fDefinition').value.trim(),
    derivation: document.getElementById('fDerivation').value.trim(),
    conclusion: document.getElementById('fConclusion').value.trim(),
    memoryTips: document.getElementById('fMemoryTips').value.trim(),
    examNotes: document.getElementById('fExamNotes').value.trim(),
    difficulty: parseInt(document.getElementById('fDifficulty').value),
    importance: parseInt(document.getElementById('fImportance').value),
    examValue: parseInt(document.getElementById('fExamValue').value),
    examFrequency: document.getElementById('fExamFrequency').value,
    mastery: document.getElementById('fMastery').value,
    questionTypes: [...document.querySelectorAll('#fQuestionTypes input:checked')].map(cb => cb.value),
    prerequisite: [],
    reviewCount: 0,
    lastReview: null,
    nextReview: today(),
    favorite: false,
    createdAt: new Date().toISOString(),
  };

  state.nodes.set(node.id, node);
  await db.nodes.put(node);

  // Save formula if LaTeX provided
  const latexText = document.getElementById('fLatex').value.trim();
  if (latexText) {
    const formula = {
      id: uid(),
      nodeId: node.id,
      name: `${name} 公式`,
      latex: latexText,
      conditions: '',
      example: '',
    };
    state.formulas.set(formula.id, formula);
    await db.formulas.put(formula);
  }

  closeModal();
  refreshNetwork();
  renderCourseTree();
  renderStats();
  renderReviewList();
  toast('知识点已创建');
}

async function saveEditNode() {
  const nodeId = document.getElementById('fEditId').value;
  const node = state.nodes.get(nodeId);
  if (!node) return;

  node.type = document.getElementById('fNodeType').value;
  node.subject = document.getElementById('fSubject').value;
  node.name = document.getElementById('fName').value.trim();
  node.chapter = document.getElementById('fChapter').value.trim();
  node.module = document.getElementById('fModule').value.trim();
  node.definition = document.getElementById('fDefinition').value.trim();
  node.derivation = document.getElementById('fDerivation').value.trim();
  node.conclusion = document.getElementById('fConclusion').value.trim();
  node.memoryTips = document.getElementById('fMemoryTips').value.trim();
  node.examNotes = document.getElementById('fExamNotes').value.trim();
  node.difficulty = parseInt(document.getElementById('fDifficulty').value);
  node.importance = parseInt(document.getElementById('fImportance').value);
  node.examValue = parseInt(document.getElementById('fExamValue').value);
  node.examFrequency = document.getElementById('fExamFrequency').value;
  node.mastery = document.getElementById('fMastery').value;
  node.questionTypes = [...document.querySelectorAll('#fQuestionTypes input:checked')].map(cb => cb.value);

  state.nodes.set(nodeId, node);
  await db.nodes.put(node);

  // Update formulas
  await db.formulas.where('nodeId').equals(nodeId).delete();
  const latexText = document.getElementById('fLatex').value.trim();
  if (latexText) {
    const formula = {
      id: uid(),
      nodeId,
      name: `${node.name} 公式`,
      latex: latexText,
      conditions: '',
      example: '',
    };
    state.formulas.set(formula.id, formula);
    await db.formulas.put(formula);
  }
  // reload formulas
  const formulas = await db.formulas.toArray();
  state.formulas = new Map(formulas.map(f => [f.id, f]));

  closeModal();
  refreshNetwork();
  renderCourseTree();
  renderStats();
  updateRightPanel(nodeId);
  toast('知识点已更新');
}

async function saveEdge(fromNodeId) {
  const toNodeId = document.getElementById('fEdgeTo').value;
  const type = document.getElementById('fEdgeType').value;
  const description = document.getElementById('fEdgeDesc').value.trim();

  if (!toNodeId) { toast('请选择目标节点'); return; }
  if (fromNodeId === toNodeId) { toast('不能连线到自身'); return; }

  // Check duplicate
  for (const e of state.edges.values()) {
    if (e.from === fromNodeId && e.to === toNodeId && e.type === type) {
      toast('该连线已存在'); return;
    }
  }

  const edge = {
    id: uid(),
    from: fromNodeId,
    to: toNodeId,
    type,
    description,
  };
  state.edges.set(edge.id, edge);
  await db.edges.put(edge);

  closeModal();
  refreshNetwork();
  toast('连线已创建');
}

async function deleteEdge(edgeId) {
  if (!confirm('确定删除此连线？')) return;
  state.edges.delete(edgeId);
  await db.edges.delete(edgeId);
  refreshNetwork();
  toast('连线已删除');
}

// Listen for edge selection to allow deletion
document.addEventListener('keydown', async (e) => {
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (!state.network) return;
    const selectedEdges = state.network.getSelectedEdges();
    if (selectedEdges.length > 0) {
      for (const eid of selectedEdges) {
        await deleteEdge(eid);
      }
    }
  }
});

async function saveMistake() {
  const nodeId = document.getElementById('fMistakeNodeId').value;
  const question = document.getElementById('fMistakeQuestion').value.trim();
  if (!question) { toast('请输入题目内容'); return; }

  const mistake = {
    id: uid(),
    nodeId,
    question,
    answer: document.getElementById('fMistakeAnswer').value.trim(),
    correctAnswer: document.getElementById('fMistakeCorrectAnswer').value.trim(),
    mistakeType: document.getElementById('fMistakeType').value,
    reason: document.getElementById('fMistakeReason').value.trim(),
    note: document.getElementById('fMistakeNote').value.trim(),
    createdAt: new Date().toISOString(),
  };

  if (!state.mistakes.has(nodeId)) state.mistakes.set(nodeId, []);
  state.mistakes.get(nodeId).push(mistake);
  await db.mistakes.put(mistake);
  await autoDiagnoseMistake(nodeId);

  closeModal();
  refreshNetwork();
  renderCourseTree();
  renderReviewList();
  if (state.selectedNodeId === nodeId) updateRightPanel(nodeId);
  toast('错题已保存');
}

// ============================================================
//  COURSE TREE
// ============================================================
function renderCourseTree() {
  const container = document.getElementById('courseTree');
  // Group by subject -> chapter -> module
  const tree = {};
  for (const node of state.nodes.values()) {
    const subj = node.subject || 'other';
    const ch = node.chapter || '未分类';
    if (!tree[subj]) tree[subj] = {};
    if (!tree[subj][ch]) tree[subj][ch] = [];
    tree[subj][ch].push(node);
  }

  // Also add mistake entries
  const mistakeNodes = new Set();
  for (const [nid] of state.mistakes) mistakeNodes.add(nid);

  // Favorite nodes
  const favNodes = [...state.nodes.values()].filter(n => n.favorite);

  let html = '';

  // Favorites
  if (favNodes.length > 0) {
    html += `<div class="course-node">
      <div class="course-node-header" onclick="this.querySelector('.arrow').classList.toggle('open');this.nextElementSibling.classList.toggle('open');">
        <span class="arrow">▶</span> ⭐ 我的收藏 (${favNodes.length})
      </div>
      <div class="course-node-children">`;
    for (const n of favNodes) {
      html += `<div class="course-node-child" onclick="focusNode('${n.id}')">${escapeHtml(n.name)}</div>`;
    }
    html += '</div></div>';
  }

  // Mistake overview
  if (mistakeNodes.size > 0) {
    html += `<div class="course-node">
      <div class="course-node-header" onclick="this.querySelector('.arrow').classList.toggle('open');this.nextElementSibling.classList.toggle('open');">
        <span class="arrow">▶</span> ❌ 错题关联 (${mistakeNodes.size}个知识点)
      </div>
      <div class="course-node-children">`;
    for (const nid of mistakeNodes) {
      const n = state.nodes.get(nid);
      if (!n) continue;
      const cnt = (state.mistakes.get(nid) || []).length;
      html += `<div class="course-node-child" onclick="focusNode('${nid}')">${escapeHtml(n.name)} (${cnt})</div>`;
    }
    html += '</div></div>';
  }

  // Subject tree
  for (const [subjKey, chapters] of Object.entries(tree)) {
    const subj = SUBJECTS[subjKey] || { label: subjKey, color: '#888' };
    const totalInSubj = Object.values(chapters).flat().length;
    html += `<div class="course-node">
      <div class="course-node-header" onclick="this.querySelector('.arrow').classList.toggle('open');this.nextElementSibling.classList.toggle('open');">
        <span class="arrow">▶</span>
        <span class="dot" style="background:${subj.color};"></span>
        ${subj.label} (${totalInSubj})
      </div>
      <div class="course-node-children">`;
    for (const [chName, nodes] of Object.entries(chapters)) {
      html += `<div class="course-node">
        <div class="course-node-header" onclick="event.stopPropagation();this.querySelector('.arrow').classList.toggle('open');this.nextElementSibling.classList.toggle('open');" style="padding-left:12px;">
          <span class="arrow">▶</span> 📂 ${escapeHtml(chName)} (${nodes.length})
        </div>
        <div class="course-node-children">`;
      for (const n of nodes) {
        const mc = (state.mistakes.get(n.id) || []).length;
        const mcBadge = mc > 0 ? ` 🔴${mc}` : '';
        html += `<div class="course-node-child" onclick="focusNode('${n.id}')">${NODE_TYPES[n.type]?.icon||'📘'} ${escapeHtml(n.name)}${mcBadge}</div>`;
      }
      html += '</div></div>';
    }
    html += '</div></div>';
  }

  if (Object.keys(tree).length === 0) {
    html = '<div style="font-size:12px;color:var(--text-dim);padding:8px;">暂无知识点，点击下方「新增节点」或「导入种子数据」开始</div>';
  }

  container.innerHTML = html;
}

function focusNode(nodeId) {
  if (!state.network) return;
  state.selectedNodeId = nodeId;

// ============================================================
//  REVIEW LIST
// ============================================================
async function checkReviewDue() {
  const due = [];
  const t = today();
  for (const node of state.nodes.values()) {
    if (node.nextReview && node.nextReview <= t && node.mastery !== 'mastered') {
      due.push(node);
    }
  }
  return due;
}

async function renderReviewList() {
  const container = document.getElementById('reviewList');
  const due = await checkReviewDue();

  if (due.length === 0) {
    container.innerHTML = '<div style="font-size:12px;color:var(--text-dim);padding:4px 0;">✅ 暂无待复习项</div>';
    return;
  }

  // Sort by urgency: days overdue
  const t = today();
  due.sort((a, b) => daysDiff(a.nextReview, t) - daysDiff(b.nextReview, t));

  let html = '';
  for (const node of due) {
    const overdue = daysDiff(node.nextReview, t);
    let urgency = 'urgent-green';
    let badge = { cls: 'green', text: '今天' };
    if (overdue >= 3) { urgency = 'urgent-red'; badge = { cls: 'red', text: `${overdue}天未复习` }; }
    else if (overdue >= 1) { urgency = 'urgent-yellow'; badge = { cls: 'yellow', text: `${overdue}天前` }; }

    html += `<div class="review-item ${urgency}" onclick="focusNode('${node.id}')">
      <span class="badge ${badge.cls}">${badge.text}</span>
      <span>${escapeHtml(node.name)}</span>
    </div>`;
  }
  container.innerHTML = html;
}

async function importJSON(file) {
  try {
    const text = await file.text();
    const data = JSON.parse(text);

    if (!data.nodes || !Array.isArray(data.nodes)) {
      toast('无效的数据格式：缺少 nodes 数组');
      return;
    }

    const mode = confirm('点击「确定」合并到现有数据，点击「取消」覆盖全部数据？');
    if (!mode) {
      // 覆盖：清空
      await db.nodes.clear();
      await db.edges.clear();
      await db.formulas.clear();
      await db.mistakes.clear();
      await db.studyRecords.clear();
      state.nodes.clear();
      state.edges.clear();
      state.formulas.clear();
      state.mistakes.clear();
      state.studyRecords = [];
    }

    for (const n of data.nodes) { state.nodes.set(n.id, n); await db.nodes.put(n); }
    if (data.edges) for (const e of data.edges) { state.edges.set(e.id, e); await db.edges.put(e); }
    if (data.formulas) { for (const f of data.formulas) { state.formulas.set(f.id || f.nodeId, f); await db.formulas.put(f); } }
    if (data.mistakes) {
      for (const m of data.mistakes) {
        if (!state.mistakes.has(m.nodeId)) state.mistakes.set(m.nodeId, []);
        state.mistakes.get(m.nodeId).push(m);
        await db.mistakes.put(m);
      }
    }
    if (data.studyRecords) for (const r of data.studyRecords) { state.studyRecords.push(r); await db.studyRecords.put(r); }

    refreshNetwork();
    renderCourseTree();
    renderStats();
    renderReviewList();

    toast('导入失败：' + e.message);

// ============================================================
//  SEARCH
// ============================================================
function searchNodes(query) {
  if (!state.network || !query.trim()) return;
  const q = query.toLowerCase();
  const matched = [];
  for (const node of state.nodes.values()) {
    if (node.name.toLowerCase().includes(q) ||
        (node.definition && node.definition.toLowerCase().includes(q)) ||
        (node.chapter && node.chapter.toLowerCase().includes(q))) {
      matched.push(node.id);
    }
  }
  // Also search mistakes
  for (const [nid, ms] of state.mistakes) {
    for (const m of ms) {
      if ((m.question && m.question.toLowerCase().includes(q)) ||
          (m.reason && m.reason.toLowerCase().includes(q))) {
        if (!matched.includes(nid)) matched.push(nid);
        break;
      }
    }
  }

  if (matched.length > 0) {
    state.network.selectNodes(matched);
    state.network.focus(matched[0], { scale: 1.2, animation: true });
    toast(`找到 ${matched.length} 个匹配节点`);
  } else {
    toast('未找到匹配结果');
  }
}

async function loadKnowledgeBase(file) {
  try {
    const resp = await fetch(`knowledge-base/${file}`);
    if (!resp.ok) throw new Error(`${file} not found`);
    return await resp.json();
  } catch (e) {
    toast(`加载知识库失败: ${file} - ${e.message}`);
    return null;
  }
}

function buildSeedData() {
  // Kept for backward compat — returns empty, actual loading via importSeedData
  return { nodes: [], edges: [], formulas: [], questions: [] };
}

async function importSeedData() {
  const files = ['calculus.json', 'linear-algebra.json', 'probability.json'];
  const subjects = { calculus: 'gaoshu', 'linear-algebra': 'xiandai', probability: 'gailv' };
  let totalNodes = 0, totalEdges = 0, totalFormulas = 0, totalQuestions = 0;

  for (const file of files) {
    const data = await loadKnowledgeBase(file);
    if (!data) continue;
    for (const n of data.nodes) {
      if (state.nodes.has(n.id)) continue; // skip duplicates
      n._fromSeed = true;
      state.nodes.set(n.id, n);
      await db.nodes.put(n);
      totalNodes++;
    }
    if (data.edges) for (const e of data.edges) {
      if (state.edges.has(e.id)) continue;
      state.edges.set(e.id, e);
      await db.edges.put(e);
      totalEdges++;
    }
    if (data.formulas) for (const f of data.formulas) {
      state.formulas.set(f.id, f);
      await db.formulas.put(f);
      totalFormulas++;
    }
    // Load embedded questions from nodes
    for (const n of data.nodes) {
      if (n.questions && n.questions.length > 0) {
        for (const q of n.questions) {
          if (state.questions.has(q.id)) continue;
          q.knowledgeIds = q.knowledgeIds || [n.id];
          state.questions.set(q.id, q);
          await db.questions.put(q);
          totalQuestions++;
        }
      }
    }
  }

  refreshNetwork();
  renderCourseTree();
  renderStats();
  renderReviewList();
  toast(`种子数据导入完成：${totalNodes}节点 ${totalEdges}连线 ${totalFormulas}公式 ${totalQuestions}题库`);
}

// ============================================================
async function importPDF() {
  toast('正在加载PDF解析引擎…');
  const pdfjs = await ensurePDFJS();
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.pdf';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    toast('正在解析PDF目录结构…');
    try {
      const arrayBuf = await file.arrayBuffer();
      const pdf = await pdfjs.getDocument({ data: arrayBuf }).promise;
      const chapters = [];
      const headingRe = /^(第[一二三四五六七八九十\d]+章|第\d+章|[§]\s*\d+\.?\d*|\d+\.\d+|CHAPTER\s*\d+)/im;
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const text = (await page.getTextContent()).items.map(it => it.str).join(' ');
        const lines = text.split(/[.\n;]/);
        for (const line of lines) {
          const m = line.trim().match(headingRe);
          if (m && !chapters.find(c => c.title === line.trim())) {
            chapters.push({ title: line.trim().slice(0, 80), page: i });
          }
        }
      }
      if (chapters.length === 0) { toast('未检测到章节标题，请确认PDF为教材格式'); return; }
      showChapterImportDialog(chapters);
    } catch (err) { toast('PDF解析失败: ' + err.message); }
  };
  input.click();
}

async function importMarkdown() {
  var input = document.createElement('input');
  input.type = 'file'; input.accept = '.md,.txt,.markdown';
  input.onchange = async function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var text = await file.text();
    var lines = text.split('\n');
    var items = [];
    var currentH1 = '', currentH2 = '';
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var h1m = line.match(/^#\s+(.+)/);
      var h2m = line.match(/^##\s+(.+)/);
      var h3m = line.match(/^###\s+(.+)/);
      if (h1m) { currentH1 = h1m[1].trim(); currentH2 = ''; }
      else if (h2m) { currentH2 = h2m[1].trim(); }
      else if (h3m) { items.push({ chapter: currentH1, module: currentH2, name: h3m[1].trim(), content: '' }); }
      else if (items.length > 0 && line.trim()) { items[items.length-1].content += line.trim() + '\n'; }
    }
    if (items.length === 0) { toast('未检测到 ### 标题，请使用 Markdown 三级标题'); return; }
    showMarkdownImportDialog(items);
  };
  input.click();
}

var quizState = { questions: [], currentIdx: 0, correct: 0, wrong: [] };

async function startQuiz() {
  var allQuestions = Array.from(state.questions.values());
  if (allQuestions.length === 0) { toast('暂无题库，请先导入种子数据'); return; }
  var scored = allQuestions.map(function(q) {
    var node = (q.knowledgeIds || []).map(function(id) { return state.nodes.get(id); }).find(Boolean);
    return Object.assign({}, q, { _score: node ? calcExamIndex(node, state.examMode) : 50 });
  });
  scored.sort(function(a, b) { return b._score - a._score; });
  var topN = scored.slice(0, Math.min(20, scored.length));
  for (var i = topN.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var tmp = topN[i]; topN[i] = topN[j]; topN[j] = tmp; }
  quizState = { questions: topN, currentIdx: 0, correct: 0, wrong: [] };
  showQuizQuestion();
}

function showQuizQuestion() {
  if (quizState.currentIdx >= quizState.questions.length) { showQuizResult(); return; }
  var q = quizState.questions[quizState.currentIdx];
  var total = quizState.questions.length;
  var idx = quizState.currentIdx + 1;
  var body = '<div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">题目 ' + idx + '/' + total + ' | ' + (q.type||'计算') + ' | ' + '⭐'.repeat(q.difficulty||3) + '</div>';
  body += '<div style="font-size:15px;font-weight:600;margin-bottom:12px;line-height:1.6;">' + escapeHtml(q.content) + '</div>';
  body += '<div class="form-group"><label>你的答案</label><textarea id="quizAnswer" style="min-height:60px;"></textarea></div>';
  body += '<div id="quizFeedback" style="display:none;padding:8px;border-radius:var(--radius-sm);margin-top:8px;"></div>';
  var footer = '<button class="btn btn-secondary" onclick="closeModal()">退出</button><button class="btn btn-primary" id="quizSubmitBtn" onclick="submitQuizAnswer()">提交</button><button class="btn btn-primary hidden" id="quizNextBtn" onclick="showQuizQuestion()">下一题 ▶</button>';
  showModal('🎯 自测练习', body, footer);
}

async function submitQuizAnswer() {
  var q = quizState.questions[quizState.currentIdx];
  var answer = document.getElementById('quizAnswer').value.trim();
  var fb = document.getElementById('quizFeedback');
  fb.style.display = 'block';
  var correct = q.answer.trim();
  var isCorrect = answer && correct && (answer === correct || answer.replace(/\s/g,'') === correct.replace(/\s/g,''));
  if (isCorrect) {
    quizState.correct++;
    fb.style.background = 'rgba(77,227,154,0.15)';
    fb.innerHTML = '✅ <b>正确！</b><br><span style="font-size:12px;">答案: ' + escapeHtml(q.answer) + '</span>';
  } else {
    quizState.wrong.push(q);
    fb.style.background = 'rgba(255,102,119,0.15)';
    fb.innerHTML = '❌ <b>不正确</b><br><span style="font-size:12px;">正确答案: ' + escapeHtml(q.answer) + '</span>';
    if (q.explanation) fb.innerHTML += '<br><span style="font-size:11px;">解析: ' + escapeHtml(q.explanation) + '</span>';
    for (var i = 0; i < (q.knowledgeIds || []).length; i++) {
      var nid = q.knowledgeIds[i];
      if (!state.nodes.has(nid)) continue;
      var mistake = { id: uid(), nodeId: nid, question: q.content, answer: answer, correctAnswer: q.answer, mistakeType: 'concept', reason: '自测答错', note: q.explanation || '', createdAt: new Date().toISOString() };
      if (!state.mistakes.has(nid)) state.mistakes.set(nid, []);
      state.mistakes.get(nid).push(mistake);
      await db.mistakes.put(mistake);
      await autoDiagnoseMistake(nid);
    }
  }
  quizState.currentIdx++;
  document.getElementById('quizSubmitBtn').classList.add('hidden');
  document.getElementById('quizNextBtn').classList.remove('hidden');
  if (quizState.currentIdx >= quizState.questions.length) {
    document.getElementById('quizNextBtn').textContent = '查看结果 📊';
  }
}

function showQuizResult() {
  var total = quizState.questions.length;
  var pct = total > 0 ? Math.round(quizState.correct / total * 100) : 0;
  var body = '<div style="text-align:center;font-size:48px;margin:16px 0;">' + (pct >= 80 ? '🎉' : pct >= 50 ? '📚' : '💪') + '</div>';
  body += '<div style="text-align:center;font-size:24px;font-weight:700;">' + quizState.correct + '/' + total + ' 正确 (' + pct + '%)</div>';
  if (quizState.wrong.length > 0) {
    var weakNodes = new Set();
    for (var i = 0; i < quizState.wrong.length; i++) {
      var q = quizState.wrong[i];
      for (var j = 0; j < (q.knowledgeIds || []).length; j++) {
        var n = state.nodes.get(q.knowledgeIds[j]);
        if (n) weakNodes.add(n.name);
      }
    }
    body += '<div style="margin-top:12px;font-size:13px;font-weight:600;">薄弱知识点：</div>';
    body += '<div class="tag-row">';
    weakNodes.forEach(function(n) { body += '<span class="tag" style="background:rgba(255,102,119,0.15);color:var(--urgent-red);">' + escapeHtml(n) + '</span>'; });
    body += '</div>';
    body += '<div style="margin-top:8px;font-size:11px;color:var(--text-muted);">错题已自动保存到对应知识点</div>';
  }
  var footer = '<button class="btn btn-primary" onclick="closeModal();refreshNetwork();renderStats();renderReviewList();">完成</button>';
  showModal('练习结果', body, footer);
}

// ============================================================
//  AUTO-DIAGNOSIS
// ============================================================
async function autoDiagnoseMistake(nodeId) {
  var visited = new Set([nodeId]);
  var queue = [{ id: nodeId, depth: 0 }];
  while (queue.length > 0) {
    var item = queue.shift();
    if (item.depth >= 2) continue;
    var edgeValues = state.edges.values();
    for (var it = edgeValues.next(); !it.done; it = edgeValues.next()) {
      var edge = it.value;
      if (edge.to === item.id && edge.type === 'prerequisite') {
        var fromId = edge.from;
        if (!visited.has(fromId)) {
          visited.add(fromId);
          queue.push({ id: fromId, depth: item.depth + 1 });
          var preqNode = state.nodes.get(fromId);
          if (preqNode) {
            var keys = ['none','weak','learning','good','mastered'];
            var ci = keys.indexOf(preqNode.mastery || 'none');
            if (ci > 0) { preqNode.mastery = keys[Math.max(0, ci - 1)]; state.nodes.set(fromId, preqNode); await db.nodes.put(preqNode); }
          }
        }
      }
    }
  }
}

//  EXAM MODE SWITCH
// ============================================================
async function switchExamMode(mode) {
  state.examMode = mode;
  await db.settings.put({ key: 'examMode', value: mode });
  refreshNetwork();
  toast('考试模式: ' + (EXAM_MODES[mode] ? EXAM_MODES[mode].label : mode));
}

  await loadData();
  initNetwork();
  renderCourseTree();
  renderStats();
  renderReviewList();

  // Theme toggle
  document.getElementById('themeBtn').addEventListener('click', toggleTheme);

  // Mode tabs
  document.querySelectorAll('.mode-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      state.currentMode = tab.dataset.mode;
      applyMode();
    });
  });

  // Search
  const searchInput = document.getElementById('searchInput');
  let searchTimeout;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => searchNodes(searchInput.value), 300);
  });

  // Buttons
  document.getElementById('btnAddNode').addEventListener('click', openAddNodeModal);
  document.getElementById('btnImport').addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = (e) => { if (e.target.files[0]) importJSON(e.target.files[0]); };
    input.click();
  });
  document.getElementById('btnExport').addEventListener('click', exportJSON);
  document.getElementById('btnSeed').addEventListener('click', importSeedData);
  document.getElementById('btnImportPDF').addEventListener('click', importPDF);
  document.getElementById('btnImportMD').addEventListener('click', importMarkdown);
  document.getElementById('btnQuiz').addEventListener('click', startQuiz);
  document.getElementById('btnScreenshot').addEventListener('click', exportScreenshot);
  document.getElementById('examModeSelect').addEventListener('change', (e) => switchExamMode(e.target.value));
  document.getElementById('btnFit').addEventListener('click', () => {
    if (state.network) state.network.fit({ animation: true });
  });
  document.getElementById('btnHierarchy').addEventListener('click', () => {
    if (!state.network) return;
    state.network.setOptions({
      layout: {
        hierarchical: { enabled: true, direction: 'UD', sortMethod: 'directed', levelSeparation: 150, nodeSpacing: 120 },
      },
      physics: { enabled: false },
    });
    setTimeout(() => {
      state.network.setOptions({
        layout: { hierarchical: { enabled: false } },
        physics: { enabled: true },
      });
      state.network.fit({ animation: true });
    }, 500);
    toast('层级布局已应用');
  });
  document.getElementById('btnCloseRight').addEventListener('click', () => {
    state.selectedNodeId = null;
    updateRightPanel(null);
  });

  // Load draft from localStorage
  const savedDraft = localStorage.getItem('mathgraph_draft');
  if (savedDraft) document.getElementById('draftPad').value = savedDraft;
  document.getElementById('draftPad').addEventListener('input', (e) => {
    localStorage.setItem('mathgraph_draft', e.target.value);
  });

  console.log('MathGraph 初始化完成 ✅');
  console.log(`节点: ${state.nodes.size} | 连线: ${state.edges.size} | 公式: ${state.formulas.size} | 错题: ${[...state.mistakes.values()].flat().length}`);
});
</script>
